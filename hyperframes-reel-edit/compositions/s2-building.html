          const tl = gsap.timeline({ paused: true });
          const D = document;

          const rise = (sel, at, d = 0.2) => tl.fromTo(sel, { yPercent: 115 }, { yPercent: 0, duration: d, ease: "power4.out" }, at);
          const draw = (sel, at, d, ease = "power2.out") => tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease }, at);
          // phase 2 text slots stay hidden until their phase; phase 1 slots hide after exit
          tl.set(["#s2-t2", "#s2-m2"], { autoAlpha: 1 }, 1.357);
          tl.set(["#s2-t1", "#s2-m1"], { autoAlpha: 0 }, 1.45);
          // phase 1 — spacious
          tl.fromTo("#s2-card", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 0);
          rise("#s2-sp", 0.03);
          rise("#s2-wide", 0.74);
          draw("#s2-dl", 0.74, 0.32); draw("#s2-dr", 0.74, 0.32);
          tl.fromTo(["#s2-tl", "#s2-tr"], { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 1.04);
          // phase 2 — the card becomes one unit of the building (shared-element handoff)
          tl.to(["#s2-sp", "#s2-wide"], { yPercent: -115, duration: 0.16, ease: "power2.in" }, 1.28);
          tl.to("#s2-dimg", { opacity: 0, duration: 0.14, ease: "power1.out" }, 1.30);
          tl.fromTo("#s2-card", { x: 0, y: 0, scale: 1 }, { x: 140, y: -193.5, scale: 0.3095, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 1.357);

          for (let i = 1; i <= 7; i++) tl.fromTo("#s2-c" + i, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.22, ease: "power4.out" }, 1.97 + (i - 1) * 0.07);
