<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face{font-family:"Cairo";font-style:normal;font-weight:600;font-display:block;src:url("assets/fonts/cairo-arabic-600-normal.woff2") format("woff2");}
@font-face{font-family:"Cairo";font-style:normal;font-weight:700;font-display:block;src:url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2");}
@font-face{font-family:"Cairo";font-style:normal;font-weight:800;font-display:block;src:url("assets/fonts/cairo-arabic-800-normal.woff2") format("woff2");}
@font-face{font-family:"Cairo";font-style:normal;font-weight:900;font-display:block;src:url("assets/fonts/cairo-arabic-900-normal.woff2") format("woff2");}

#s4-cta-root{position:absolute;inset:0;overflow:hidden;--paper:#E9E0D3;--paper-dark:#D4C8B8;--paper-light:#F6F0E7;--cream:#FFFDF7;--ink:#1B1D1E;--ink-soft:#3A3D3E;--accent-warm:#E66A21;--accent-warm-dark:#C85218;--accent-cool:#2A8791;--accent-cool-dark:#216A72;--accent-gold:#D8A44A;font-family:"Cairo","DejaVu Sans",sans-serif;color:var(--ink);direction:rtl;}
#s4-cta-bg{position:absolute;inset:0;background:radial-gradient(130% 85% at 50% 38%,#F6F0E7 0%,#E9E0D3 58%,#D9CDBD 100%);}
/* paper grain: registry component grain-overlay, adapted to a static (non-animated) paper tooth */
#s4-cta-grain{position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-size:256px 256px;opacity:.13;mix-blend-mode:multiply;}
.mask{position:absolute;left:80px;right:80px;overflow:hidden;text-align:center;white-space:nowrap;}
.mask .w{display:inline-block;}


#s4-top{top:236px;font-weight:700;font-size:54px;line-height:1.3;color:var(--ink-soft);padding:0 0 12px;}
#s4-top .w{margin:0 9px;}
#s4-house{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible;}
#s4-name{top:920px;font-weight:900;font-size:176px;line-height:1.2;padding:4px 0 24px;}
#s4-line{top:1146px;font-weight:900;line-height:1.2;padding:4px 0 28px;}
#s4-hi{font-size:118px;font-weight:800;color:var(--ink-soft);margin:0 18px;}
#s4-ch{font-size:218px;color:var(--accent-warm-dark);margin:0 18px;}

      </style>
      <div id="s4-cta-root" data-composition-id="s4-cta" data-width="1080" data-height="1920" dir="rtl">
        <div id="s4-cta-bg"></div>

        <div class="mask" id="s4-top"><span class="w" id="s4-t1">فرصة</span><span class="w" id="s4-t2">استثنائية</span><span class="w" id="s4-t3">ومميزة</span></div>
        <svg id="s4-house" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path id="s4-roof" d="M 316 700 L 540 506 L 764 700" pathLength="1" stroke="#1B1D1E" stroke-width="16" />
            <path id="s4-body" d="M 372 652 L 372 880 L 708 880 L 708 652" pathLength="1" stroke="#1B1D1E" stroke-width="16" />
            <path id="s4-chk" d="M 452 772 L 516 832 L 632 712" pathLength="1" stroke="#E66A21" stroke-width="22" />
          </g>
        </svg>
        <div class="mask" id="s4-name"><span class="w" id="s4-n1">ديارة</span></div>
        <div class="mask" id="s4-line"><span class="w" id="s4-hi">هي</span><span class="w" id="s4-ch">خيارك</span></div>

        <div id="s4-cta-grain"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const D = document;

          const rise = (sel, at, d = 0.2) => tl.fromTo(sel, { yPercent: 115 }, { yPercent: 0, duration: d, ease: "power4.out" }, at);
          const draw = (sel, at, d, ease = "power2.out") => tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease }, at);
          rise("#s4-t1", 0.0); rise("#s4-t2", 0.04); rise("#s4-t3", 0.08);
          draw("#s4-roof", 0.0, 0.32); draw("#s4-body", 0.18, 0.36);
          rise("#s4-n1", 0.017, 0.22);
          rise("#s4-hi", 0.967);
          rise("#s4-ch", 1.367, 0.22);
          draw("#s4-chk", 1.40, 0.26);

          window.__timelines["s4-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
